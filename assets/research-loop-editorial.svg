<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc"><title id="title">Model–Experiment Loop</title><desc id="desc">A warm editorial four-stage loop: Data, Build, Test, Learn.</desc><style>.ink{fill:#282625;font-family:Inter,Arial,sans-serif}.muted{fill:#6b6560;font-family:Inter,Arial,sans-serif}.mono{font-family:"Roboto Mono","Courier New",monospace}.k{font-size:13px;letter-spacing:2px;font-weight:700}.h{font-size:20px;font-weight:700;letter-spacing:1px}.s{font-size:13px}.m{animation:p 8s ease-in-out infinite}@keyframes p{0%,100%{opacity:.35}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.m{animation:none}}</style><rect width="1200" height="430" rx="14" fill="#f5f1e9"/><rect x="1" y="1" width="1198" height="428" rx="13" fill="none" stroke="#d2c8bc"/><text x="42" y="48" class="ink k">MODEL–EXPERIMENT LOOP</text><text x="42" y="77" class="muted s">A reusable system for turning evidence into the next decision.</text><path d="M120 244 H1080" stroke="#d2c8bc" stroke-width="3"/><path d="M1078 244 l-14 -8 m14 8 l-14 8" stroke="#a47b43" stroke-width="2" fill="none"/><g transform="translate(42 142)"><rect width="240" height="136" rx="10" fill="#fffdf8" stroke="#0c7475" stroke-width="2"/><rect width="6" height="136" rx="3" fill="#0c7475"/><text x="28" y="40" class="ink h">DATA</text><text x="28" y="76" class="muted mono s">literature · priors</text><circle class="m" cx="206" cy="34" r="5" fill="#0c7475"/></g><g transform="translate(322 142)"><rect width="240" height="136" rx="10" fill="#fffdf8" stroke="#6f1d2b" stroke-width="2"/><rect width="6" height="136" rx="3" fill="#6f1d2b"/><text x="28" y="40" class="ink h">BUILD</text><text x="28" y="76" class="muted mono s">models · candidates</text><circle class="m" cx="206" cy="34" r="5" fill="#6f1d2b" style="animation-delay:1.6s"/></g><g transform="translate(602 142)"><rect width="240" height="136" rx="10" fill="#fffdf8" stroke="#0c7475" stroke-width="2"/><rect width="6" height="136" rx="3" fill="#0c7475"/><text x="28" y="40" class="ink h">TEST</text><text x="28" y="76" class="muted mono s">assays · evidence</text><circle class="m" cx="206" cy="34" r="5" fill="#0c7475" style="animation-delay:3.2s"/></g><g transform="translate(882 142)"><rect width="240" height="136" rx="10" fill="#fffdf8" stroke="#a47b43" stroke-width="2"/><rect width="6" height="136" rx="3" fill="#a47b43"/><text x="28" y="40" class="ink h">LEARN</text><text x="28" y="76" class="muted mono s">updates · next cycle</text><circle class="m" cx="206" cy="34" r="5" fill="#a47b43" style="animation-delay:4.8s"/></g><text x="42" y="350" class="muted mono s">feedback path</text><text x="42" y="382" class="muted s">The loop is the product: evidence becomes a better next cycle.</text></svg>
