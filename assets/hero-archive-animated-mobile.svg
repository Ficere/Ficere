<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 78" role="img" aria-labelledby="title desc">
  <title id="title">Star chart protein design console</title>
  <desc id="desc">A narrow version of the star chart and protein banner with a slow orbit and molecular pulse.</desc>
  <defs>
    <style>@media (prefers-reduced-motion: reduce) { .motion { display: none; } }</style>
    <radialGradient id="pulse" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#b8fff3" stop-opacity="0.5" /><stop offset="1" stop-color="#4ed2d0" stop-opacity="0" /></radialGradient>
    <path id="orbitPath" d="M 252 28 A 24 14 0 1 1 251.9 28 A 24 14 0 1 1 252 28" fill="none" />
  </defs>
  <image href="data:image/jpeg;base64," x="0" y="0" width="340" height="78" preserveAspectRatio="none" />
  <g class="motion" fill="none" stroke="#d7b56e" opacity="0.72" transform="rotate(-18 252 28)">
    <ellipse cx="252" cy="28" rx="24" ry="14" stroke-width="0.8" stroke-dasharray="2 4" />
    <ellipse cx="252" cy="28" rx="17" ry="10" stroke="#62d9d4" stroke-width="0.55" opacity="0.7" />
    <animateTransform attributeName="transform" type="rotate" from="-18 252 28" to="342 252 28" dur="36s" repeatCount="indefinite" />
  </g>
  <circle class="motion" cx="252" cy="28" r="4.5" fill="url(#pulse)"><animate attributeName="r" values="3;7;3" dur="4.8s" repeatCount="indefinite" /><animate attributeName="opacity" values="0.35;0.75;0.35" dur="4.8s" repeatCount="indefinite" /></circle>
  <circle class="motion" r="1.5" fill="#a9fff1"><animateMotion dur="18s" repeatCount="indefinite" rotate="auto"><mpath href="#orbitPath" /></animateMotion></circle>
</svg>
