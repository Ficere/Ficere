<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 840" role="img" aria-labelledby="title desc"><title id="title">Model–Experiment Loop</title><desc id="desc">A vertical warm editorial four-stage loop: Data, Build, Test, Learn.</desc><style>.ink{fill:#282625;font-family:Inter,Arial,sans-serif}.muted{fill:#6b6560;font-family:Inter,Arial,sans-serif}.mono{font-family:"Roboto Mono","Courier New",monospace}.k{font-size:18px;letter-spacing:2px;font-weight:700}.h{font-size:24px;font-weight:700;letter-spacing:1px}.s{font-size:16px}.m{animation:p 8s ease-in-out infinite}@keyframes p{0%,100%{opacity:.35}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.m{animation:none}}</style><rect width="720" height="840" rx="14" fill="#f5f1e9"/><rect x="1" y="1" width="718" height="838" rx="13" fill="none" stroke="#d2c8bc"/><text x="38" y="54" class="ink k">MODEL–EXPERIMENT LOOP</text><text x="38" y="85" class="muted s">Evidence in. Better decisions out.</text><path d="M84 160 V690" stroke="#d2c8bc" stroke-width="4"/><path d="M84 690 l-10 -14 m10 14 l10 -14" stroke="#a47b43" stroke-width="2" fill="none"/><g transform="translate(126 126)"><rect width="540" height="120" rx="10" fill="#fffdf8" stroke="#0c7475" stroke-width="2"/><rect width="7" height="120" rx="3" fill="#0c7475"/><text x="28" y="42" class="ink h">DATA</text><text x="28" y="80" class="muted mono s">literature · priors</text><circle class="m" cx="500" cy="35" r="6" fill="#0c7475"/></g><g transform="translate(126 274)"><rect width="540" height="120" rx="10" fill="#fffdf8" stroke="#6f1d2b" stroke-width="2"/><rect width="7" height="120" rx="3" fill="#6f1d2b"/><text x="28" y="42" class="ink h">BUILD</text><text x="28" y="80" class="muted mono s">models · candidates</text><circle class="m" cx="500" cy="35" r="6" fill="#6f1d2b" style="animation-delay:1.6s"/></g><g transform="translate(126 422)"><rect width="540" height="120" rx="10" fill="#fffdf8" stroke="#0c7475" stroke-width="2"/><rect width="7" height="120" rx="3" fill="#0c7475"/><text x="28" y="42" class="ink h">TEST</text><text x="28" y="80" class="muted mono s">assays · evidence</text><circle class="m" cx="500" cy="35" r="6" fill="#0c7475" style="animation-delay:3.2s"/></g><g transform="translate(126 570)"><rect width="540" height="120" rx="10" fill="#fffdf8" stroke="#a47b43" stroke-width="2"/><rect width="7" height="120" rx="3" fill="#a47b43"/><text x="28" y="42" class="ink h">LEARN</text><text x="28" y="80" class="muted mono s">updates · next cycle</text><circle class="m" cx="500" cy="35" r="6" fill="#a47b43" style="animation-delay:4.8s"/></g><text x="38" y="760" class="muted s">The loop is the product: evidence becomes a better next cycle.</text></svg>
