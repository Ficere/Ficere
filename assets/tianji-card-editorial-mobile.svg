<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 190" role="img" aria-labelledby="t d"><title id="t">Tianji after-hours experiment</title><desc id="d">A compact editorial fortune card for Tianji.</desc><style>text{font-family:Inter,Arial,sans-serif}.serif{font-family:Lora,Georgia,serif}.m{animation:p 6s ease-in-out infinite}@keyframes p{0%,100%{opacity:.35}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.m{animation:none}}</style><rect x="4" y="4" width="352" height="182" rx="10" fill="#f5f1e9" stroke="#6f1d2b" stroke-width="2"/><rect x="12" y="12" width="336" height="166" rx="7" fill="#fffdf8" stroke="#d2c8bc"/><circle cx="180" cy="72" r="37" fill="none" stroke="#a47b43" stroke-dasharray="3 8"/><circle class="m" cx="180" cy="72" r="6" fill="#0c7475"/><text x="180" y="34" text-anchor="middle" fill="#6f1d2b" font-size="14" letter-spacing="2">TIANJI / AFTER HOURS</text><text x="180" y="120" text-anchor="middle" class="serif" fill="#282625" font-size="17">BaZi, but schema-validated.</text><text x="180" y="145" text-anchor="middle" class="serif" fill="#6b6560" font-size="12">A reproducible reading for an</text><text x="180" y="162" text-anchor="middle" class="serif" fill="#6b6560" font-size="12">irreproducible universe.</text></svg>
