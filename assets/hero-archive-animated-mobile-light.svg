<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 78" role="img" aria-labelledby="title desc">
  <title id="title">Star chart protein design console</title>
  <desc id="desc">A narrow star chart and protein banner with a solid-color typewriter sequence in the open left field.</desc>
  <defs>
    <filter id="heroLightLift" color-interpolation-filters="sRGB">
      <feComponentTransfer>
        <feFuncR type="linear" slope="1.08" intercept="0.035"/>
        <feFuncG type="linear" slope="1.06" intercept="0.03"/>
        <feFuncB type="linear" slope="1.02" intercept="0.02"/>
      </feComponentTransfer>
    </filter>
  </defs>
<image filter="url(#heroLightLift)" href="data:image/jpeg;base64," x="0" y="0" width="340" height="78" preserveAspectRatio="none" />
  <style>
    .hero-typing-text { fill: #f0d49a; font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 8.2px; font-weight: 600; letter-spacing: 0.5px; }
    .hero-typing-cursor { stroke: #62d9d4; stroke-width: 0.8; }
    .hero-typing-fallback { display: none; }
    @media (prefers-reduced-motion: reduce) { .hero-typing-motion { display: none; } .hero-typing-fallback { display: block; } }
  </style>
  <text class="hero-typing-fallback" x="10" y="62" fill="#f0d49a" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="8.2px" font-weight="600">From atoms to assays</text>
  <g aria-label="Typing research notes">
    <g class="hero-typing-motion" opacity="0">
      <clipPath id="heroTypeClip1"><rect x="10" y="50.5" width="0" height="18"><animate attributeName="width" values="0;105;105;0;0" keyTimes="0;0.10;0.22;0.27;1" dur="10s" repeatCount="indefinite"/></rect></clipPath>
      <text class="hero-typing-text" x="10" y="62" clip-path="url(#heroTypeClip1)">From atoms to assays</text>
      <line class="hero-typing-cursor" x1="10" x2="10" y1="50.5" y2="66.5"><animate attributeName="x1" values="10;115;115;10;10" keyTimes="0;0.10;0.22;0.27;1" dur="10s" repeatCount="indefinite"/><animate attributeName="x2" values="10;115;115;10;10" keyTimes="0;0.10;0.22;0.27;1" dur="10s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0;1;0" keyTimes="0;0.5;0.58;0.66;1" dur="1.1s" repeatCount="indefinite"/></line>
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.10;0.22;0.27;1" dur="10s" repeatCount="indefinite"/>
    </g>
    <g class="hero-typing-motion" opacity="0">
      <clipPath id="heroTypeClip2"><rect x="10" y="50.5" width="0" height="18"><animate attributeName="width" values="0;130;130;0;0" keyTimes="0;0.30;0.42;0.47;1" dur="10s" repeatCount="indefinite"/></rect></clipPath>
      <text class="hero-typing-text" x="10" y="62" clip-path="url(#heroTypeClip2)">Design → validate → learn</text>
      <line class="hero-typing-cursor" x1="10" x2="10" y1="50.5" y2="66.5"><animate attributeName="x1" values="10;140;140;10;10" keyTimes="0;0.30;0.42;0.47;1" dur="10s" repeatCount="indefinite"/><animate attributeName="x2" values="10;140;140;10;10" keyTimes="0;0.30;0.42;0.47;1" dur="10s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0;1;0" keyTimes="0;0.5;0.58;0.66;1" dur="1.1s" repeatCount="indefinite"/></line>
      <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.30;0.42;0.47;1" dur="10s" repeatCount="indefinite"/>
    </g>
    <g class="hero-typing-motion" opacity="0">
      <clipPath id="heroTypeClip3"><rect x="10" y="50.5" width="0" height="18"><animate attributeName="width" values="0;160;160;0;0" keyTimes="0;0.50;0.64;0.69;1" dur="10s" repeatCount="indefinite"/></rect></clipPath>
      <text class="hero-typing-text" x="10" y="62" clip-path="url(#heroTypeClip3)">Protein design → data feedback</text>
      <line class="hero-typing-cursor" x1="10" x2="10" y1="50.5" y2="66.5"><animate attributeName="x1" values="10;170;170;10;10" keyTimes="0;0.50;0.64;0.69;1" dur="10s" repeatCount="indefinite"/><animate attributeName="x2" values="10;170;170;10;10" keyTimes="0;0.50;0.64;0.69;1" dur="10s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0;1;0" keyTimes="0;0.5;0.58;0.66;1" dur="1.1s" repeatCount="indefinite"/></line>
      <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.50;0.64;0.69;1" dur="10s" repeatCount="indefinite"/>
    </g>
    <g class="hero-typing-motion" opacity="0">
      <clipPath id="heroTypeClip4"><rect x="10" y="50.5" width="0" height="18"><animate attributeName="width" values="0;135;135;0;0" keyTimes="0;0.72;0.85;0.90;1" dur="10s" repeatCount="indefinite"/></rect></clipPath>
      <text class="hero-typing-text" x="10" y="62" clip-path="url(#heroTypeClip4)">BaZi, but schema-validated</text>
      <line class="hero-typing-cursor" x1="10" x2="10" y1="50.5" y2="66.5"><animate attributeName="x1" values="10;145;145;10;10" keyTimes="0;0.72;0.85;0.90;1" dur="10s" repeatCount="indefinite"/><animate attributeName="x2" values="10;145;145;10;10" keyTimes="0;0.72;0.85;0.90;1" dur="10s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0;1;0" keyTimes="0;0.5;0.58;0.66;1" dur="1.1s" repeatCount="indefinite"/></line>
      <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.72;0.85;0.90;1" dur="10s" repeatCount="indefinite"/>
    </g>
  </g>
</svg>
