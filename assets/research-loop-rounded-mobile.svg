<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 900" role="img" aria-labelledby="title desc"><title id="title">DBTL cycle for protein design</title><desc id="desc">A rounded-track loop connecting data, build, test, and learn.</desc><style>@media (prefers-reduced-motion: reduce) { .motion { display:none; } } .label { font-family:Georgia,serif; } .meta { font-family:monospace; }</style><rect width="700" height="900" rx="24" fill="#0b1420"/><text x="54" y="66" fill="#d7b56e" font-family="Georgia,serif" font-size="28" letter-spacing="3">THE DBTL CYCLE</text><text x="54" y="94" fill="#9fb8b7" font-family="monospace" font-size="14" letter-spacing="1">A REPEATABLE LOOP FOR PROTEIN DESIGN</text><path d="M350 170 V770" fill="none" stroke="#314754" stroke-width="12" stroke-linecap="round"/><path class="motion" d="M350 170 V770" fill="none" stroke="#71c9c2" stroke-width="3" stroke-dasharray="3 12" opacity=".85"><animate attributeName="stroke-dashoffset" from="0" to="-90" dur="8s" repeatCount="indefinite"/></path>
<rect x="70" y="130" width="560" height="112" rx="22" fill="#101d2b" stroke="#a7834c" stroke-width="2"/>
<circle cx="350" cy="130" r="7" fill="#71c9c2"/>
<text x="350" y="172" text-anchor="middle" fill="#f1ead9" class="label" font-size="25" letter-spacing="3">DATA</text>
<text x="350" y="205" text-anchor="middle" fill="#9fb8b7" class="meta" font-size="14">priors · signals · context</text>
<rect x="70" y="290" width="560" height="112" rx="22" fill="#101d2b" stroke="#a7834c" stroke-width="2"/>
<circle cx="350" cy="290" r="7" fill="#71c9c2"/>
<text x="350" y="332" text-anchor="middle" fill="#f1ead9" class="label" font-size="25" letter-spacing="3">BUILD</text>
<text x="350" y="365" text-anchor="middle" fill="#9fb8b7" class="meta" font-size="14">models · candidates · actions</text>
<rect x="70" y="450" width="560" height="112" rx="22" fill="#101d2b" stroke="#a7834c" stroke-width="2"/>
<circle cx="350" cy="450" r="7" fill="#71c9c2"/>
<text x="350" y="492" text-anchor="middle" fill="#f1ead9" class="label" font-size="25" letter-spacing="3">TEST</text>
<text x="350" y="525" text-anchor="middle" fill="#9fb8b7" class="meta" font-size="14">observations · constraints</text>
<rect x="70" y="610" width="560" height="112" rx="22" fill="#101d2b" stroke="#a7834c" stroke-width="2"/>
<circle cx="350" cy="610" r="7" fill="#71c9c2"/>
<text x="350" y="652" text-anchor="middle" fill="#f1ead9" class="label" font-size="25" letter-spacing="3">LEARN</text>
<text x="350" y="685" text-anchor="middle" fill="#9fb8b7" class="meta" font-size="14">inference · updates · next cycle</text>
<text x="350" y="855" text-anchor="middle" fill="#d7b56e" class="label" font-size="18" letter-spacing="3">DATA → BUILD → TEST → LEARN</text>
</svg>