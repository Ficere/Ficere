<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" role="img" aria-labelledby="t d"><title id="t">Global macro system and scenario observatory</title><desc id="d">A paper-toned global systems map for scenario thinking.</desc><style>text{font-family:Inter,Arial,sans-serif}.serif{font-family:Lora,Georgia,serif}.m{animation:p 12s linear infinite;transform-origin:225px 130px}@keyframes p{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.m{animation:none}}</style><rect x="5" y="5" width="890" height="250" rx="10" fill="#f5f1e9" stroke="#6f1d2b" stroke-width="2"/><g fill="none" stroke="#d2c8bc"><ellipse cx="225" cy="130" rx="150" ry="88"/><ellipse cx="225" cy="130" rx="108" ry="88" transform="rotate(28 225 130)"/><path d="M76 130H374M225 42V218"/></g><ellipse class="m" cx="225" cy="130" rx="150" ry="88" fill="none" stroke="#0c7475" stroke-dasharray="4 9"/><circle cx="225" cy="130" r="39" fill="#fffdf8" stroke="#a47b43"/><circle cx="225" cy="130" r="7" fill="#0c7475"/><text x="225" y="126" text-anchor="middle" class="serif" fill="#282625" font-size="13" letter-spacing="2">GLOBAL</text><text x="225" y="146" text-anchor="middle" class="serif" fill="#282625" font-size="13" letter-spacing="2">SYSTEM</text><g fill="#6f1d2b" font-size="10" letter-spacing="1"><text x="70" y="66">POLICY</text><text x="342" y="66">CYCLES</text><text x="362" y="194">LIQUIDITY</text><text x="44" y="198">GEOPOLITICS</text><text x="190" y="31">CROSS-ASSET</text><text x="205" y="238">SCENARIOS</text></g><g transform="translate(435 52)"><text class="serif" x="0" y="0" fill="#6f1d2b" font-size="24" letter-spacing="2">MACRO REGIME MAPPING</text><text x="0" y="32" fill="#0c7475" font-size="12" letter-spacing="1.5">GLOBAL SYSTEMS · SCENARIO BRANCHES</text><text x="0" y="76" fill="#282625" font-size="17">Global cycles, policy transmission,</text><text x="0" y="100" fill="#282625" font-size="17">geopolitical signals, and cross-asset links.</text><text x="0" y="153" fill="#6b6560" font-size="11">signals → transmission → scenarios → consequences</text></g></svg>
