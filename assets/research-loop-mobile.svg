<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 950" role="img" aria-labelledby="title desc">
  <title id="title">The Design Cycle — mobile view</title>
  <desc id="desc">A vertical mobile-friendly design cycle from hypothesis through molecular design, evaluation, experiment, feedback, and the next cycle.</desc>
  <defs>
    <style>@media (prefers-reduced-motion: reduce) { .motion { display: none; } }</style>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#172536"/><stop offset="0.55" stop-color="#0d1622"/><stop offset="1" stop-color="#070b12"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0d49a"/><stop offset="0.45" stop-color="#a7834c"/><stop offset="1" stop-color="#5d4328"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b5fff5"/><stop offset="0.5" stop-color="#4ed2d0"/><stop offset="1" stop-color="#227c9a"/>
    </linearGradient>
    <filter id="glow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#af8b51"/>
    </marker>
    <pattern id="grain" width="60" height="60" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="12" r="0.8" fill="#c3d5d5" opacity="0.13"/><circle cx="34" cy="48" r="0.7" fill="#d3c193" opacity="0.1"/><circle cx="52" cy="23" r="0.55" fill="#8da9ad" opacity="0.13"/>
    </pattern>
    <path id="mobilePath" d="M350 230 C505 275 505 355 350 400 C195 445 195 525 350 570 C505 615 505 695 350 740 C195 785 195 865 350 910" fill="none"/>
  </defs>
  <g transform="translate(0 10) scale(1 .88)">

  <rect width="700" height="1080" rx="22" fill="url(#bg)"/>
  <rect width="700" height="1080" rx="22" fill="url(#grain)" opacity="0.62"/>
  <circle cx="574" cy="88" r="48" fill="#832e3d" opacity="0.18"/>
  <circle cx="574" cy="88" r="30" fill="#1b1219" stroke="#9c4a50" stroke-width="2"/>
  <path d="M550 70 A30 30 0 0 1 595 108 A30 30 0 0 0 550 70Z" fill="#bb5960" opacity="0.55"/>

  <text x="54" y="68" fill="#d7c18c" font-family="Georgia,serif" font-size="25" letter-spacing="3">THE DESIGN CYCLE</text>
  <text x="54" y="98" fill="#89a3a9" font-family="monospace" font-size="15" letter-spacing="1.1">A CLOSED LOOP FOR MOLECULAR R&amp;D</text>

  <path d="M350 205 C505 250 505 330 350 375 C195 420 195 500 350 545 C505 590 505 670 350 715 C195 760 195 840 350 885" fill="none" stroke="#82683e" stroke-width="2" opacity="0.75" marker-end="url(#arrow)"/>
  <path d="M350 210 C475 255 475 320 350 360 C225 400 225 485 350 525 C475 565 475 650 350 690 C225 730 225 820 350 860" fill="none" stroke="#d2af70" stroke-width="1.3" stroke-dasharray="3 11" opacity="0.55"/>

  <g stroke="#ae8950" fill="#111a26" stroke-width="2">
    <circle cx="350" cy="178" r="73"/><circle cx="350" cy="348" r="73"/><circle cx="350" cy="518" r="73"/>
    <circle cx="350" cy="688" r="73"/><circle cx="350" cy="858" r="73"/><circle cx="350" cy="1010" r="50"/>
  </g>

  <g class="motion" fill="none" stroke="#62d9d4" stroke-width="2.8" opacity="0.12" filter="url(#glow)">
    <circle cx="350" cy="178" r="77"><animate attributeName="opacity" values="0.12;0.12;0.85;0.12;0.12" keyTimes="0;0.02;0.08;0.15;1" dur="13s" repeatCount="indefinite"/></circle>
    <circle cx="350" cy="348" r="77"><animate attributeName="opacity" values="0.12;0.12;0.85;0.12;0.12" keyTimes="0;0.14;0.18;0.25;1" dur="13s" repeatCount="indefinite"/></circle>
    <circle cx="350" cy="518" r="77"><animate attributeName="opacity" values="0.12;0.12;0.85;0.12;0.12" keyTimes="0;0.30;0.34;0.41;1" dur="13s" repeatCount="indefinite"/></circle>
    <circle cx="350" cy="688" r="77"><animate attributeName="opacity" values="0.12;0.12;0.85;0.12;0.12" keyTimes="0;0.48;0.54;0.61;1" dur="13s" repeatCount="indefinite"/></circle>
    <circle cx="350" cy="858" r="77"><animate attributeName="opacity" values="0.12;0.12;0.85;0.12;0.12" keyTimes="0;0.65;0.70;0.77;1" dur="13s" repeatCount="indefinite"/></circle>
    <circle cx="350" cy="1010" r="54"><animate attributeName="opacity" values="0.12;0.12;0.85;0.12;0.12" keyTimes="0;0.81;0.87;0.94;1" dur="13s" repeatCount="indefinite"/></circle>
  </g>

  <g fill="#e7d6a9" font-family="Georgia,serif" text-anchor="middle">
    <text x="350" y="171" font-size="25">HYPOTHESIS</text><text x="350" y="199" font-family="monospace" font-size="14" fill="#93b0b0">signal / question</text>
    <text x="350" y="341" font-size="25">DESIGN</text><text x="350" y="369" font-family="monospace" font-size="14" fill="#93b0b0">sequence / structure</text>
    <text x="350" y="511" font-size="24">EVALUATE</text><text x="350" y="539" font-family="monospace" font-size="14" fill="#93b0b0">score / rank / filter</text>
    <text x="350" y="681" font-size="24">EXPERIMENT</text><text x="350" y="709" font-family="monospace" font-size="14" fill="#93b0b0">assay / observe</text>
    <text x="350" y="851" font-size="24">FEEDBACK</text><text x="350" y="879" font-family="monospace" font-size="14" fill="#93b0b0">learn / calibrate</text>
    <text x="350" y="1007" font-size="20">NEXT CYCLE</text>
  </g>

  <text x="350" y="1060" fill="#d7c18c" font-family="Georgia,serif" font-size="19" text-anchor="middle" letter-spacing="2.3">WET · DRY LOOP</text>

  <circle class="motion" r="8" fill="#8ff5df" filter="url(#glow)">
    <animateMotion dur="13s" repeatCount="indefinite" rotate="auto"><mpath href="#mobilePath"/></animateMotion>
  </circle>
  </g>
</svg>
