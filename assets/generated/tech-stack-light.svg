<svg xmlns="http://www.w3.org/2000/svg" width="850" height="250" viewBox="0 0 850 250" role="img" aria-labelledby="title desc">
<title id="title">Qualitative capability radar</title>
<desc id="desc">An equal-weight map of protein and enzyme design, frontier models, atom-level tools, and wet-dry research systems.</desc>
<style>@media (prefers-reduced-motion: reduce) { .motion { display: none; } }</style>
<rect x="0.5" y="0.5" width="849" height="249" rx="16" fill="#f7f4ed" stroke="#d8d0c1" stroke-width="1"/>
<text x="30" y="42" fill="#66737a" font-size="11" font-family="monospace" letter-spacing="3">CAPABILITY RADAR</text>
<text x="30" y="78" fill="#3b3430" font-size="22" font-family="Georgia,serif">A reusable research stack</text>
<text x="30" y="112" fill="#4b6166" font-size="13" font-family="sans-serif">Four connected areas, shown as a map</text>
<text x="30" y="134" fill="#4b6166" font-size="13" font-family="sans-serif">rather than a ranked scorecard.</text>
<path d="M30 165H370" stroke="#d8d0c1" stroke-width="1"/>
<text x="30" y="192" fill="#66737a" font-size="11" font-family="monospace">DESIGN · MODELS · ATOMS · LOOP</text>
<g fill="none" stroke="#66737a" stroke-width="1" opacity=".4"><circle cx="650" cy="128" r="26"/><circle cx="650" cy="128" r="52"/><circle cx="650" cy="128" r="78"/></g>
<line x1="650" y1="128" x2="650.0" y2="50.0" stroke="#d8d0c1" stroke-width="1"/>
<circle class="motion" cx="650.0" cy="50.0" r="5" fill="#916c32"><animate attributeName="r" values="4;7;4" dur="6s" begin="0.0s" repeatCount="indefinite"/></circle>
<line x1="650" y1="128" x2="728.0" y2="128.0" stroke="#d8d0c1" stroke-width="1"/>
<circle class="motion" cx="728.0" cy="128.0" r="5" fill="#1e7d80"><animate attributeName="r" values="4;7;4" dur="6s" begin="1.0s" repeatCount="indefinite"/></circle>
<line x1="650" y1="128" x2="650.0" y2="206.0" stroke="#d8d0c1" stroke-width="1"/>
<circle class="motion" cx="650.0" cy="206.0" r="5" fill="#684f99"><animate attributeName="r" values="4;7;4" dur="6s" begin="2.0s" repeatCount="indefinite"/></circle>
<line x1="650" y1="128" x2="572.0" y2="128.0" stroke="#d8d0c1" stroke-width="1"/>
<circle class="motion" cx="572.0" cy="128.0" r="5" fill="#916c32"><animate attributeName="r" values="4;7;4" dur="6s" begin="3.0s" repeatCount="indefinite"/></circle>
<polygon points="650.0,50.0 728.0,128.0 650.0,206.0 572.0,128.0" fill="#1e7d80" fill-opacity=".10" stroke="#1e7d80" stroke-width="1.5"/>
<circle cx="650" cy="128" r="16" fill="#f7f4ed" stroke="#916c32" stroke-width="1.5"/>
<text x="650" y="132" text-anchor="middle" fill="#3b3430" font-family="monospace" font-size="9" letter-spacing="1">R&amp;D</text>
<text x="736" y="123" text-anchor="start" fill="#916c32" font-family="monospace" font-size="9">Protein &amp; Enzyme</text>
<text x="736" y="135" text-anchor="start" fill="#916c32" font-family="monospace" font-size="9">Design</text>
<text x="663" y="37" text-anchor="middle" fill="#1e7d80" font-family="monospace" font-size="9">Frontier Models</text>
<text x="564" y="123" text-anchor="end" fill="#684f99" font-family="monospace" font-size="9">Atom-Level</text>
<text x="564" y="135" text-anchor="end" fill="#684f99" font-family="monospace" font-size="9">Tools</text>
<text x="663" y="224" text-anchor="middle" fill="#916c32" font-family="monospace" font-size="9">Wet–Dry R&amp;D</text>
<text x="663" y="236" text-anchor="middle" fill="#916c32" font-family="monospace" font-size="9">Systems</text>
<path class="motion" d="M560 220H760" stroke="#1e7d80" stroke-width="1" stroke-dasharray="3 8"><animate attributeName="stroke-dashoffset" from="0" to="-90" dur="7s" repeatCount="indefinite"/></path>
</svg>