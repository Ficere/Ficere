<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 190" role="img" aria-labelledby="title desc">
  <title id="title">Tianji after-hours experiment</title>
  <desc id="desc">A compact brass and cyan fortune card for the Tianji agent experiment.</desc>
  <defs>
    <style>@media (prefers-reduced-motion: reduce) { .motion { display: none; } }</style>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#111b2a"/><stop offset="0.58" stop-color="#0a111c"/><stop offset="1" stop-color="#17101b"/></linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f0d49a"/><stop offset="0.48" stop-color="#b08d57"/><stop offset="1" stop-color="#62452b"/></linearGradient>
    <filter id="glow" x="-80%" y="-100%" width="260%" height="300%"><feGaussianBlur stdDeviation="2.5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect x="4" y="4" width="352" height="182" rx="16" fill="url(#bg)" stroke="#5f472e" stroke-width="2"/>
  <rect x="12" y="12" width="336" height="166" rx="11" fill="none" stroke="url(#brass)" stroke-width="1.3" opacity="0.8"/>
  <g class="motion" fill="#8ff5df" filter="url(#glow)">
    <circle cx="44" cy="42" r="1.8" opacity="0"><animate attributeName="cx" values="44;180;180" dur="6s" repeatCount="indefinite"/><animate attributeName="cy" values="42;74;74" dur="6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.32;0.56;1" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="314" cy="42" r="1.8" opacity="0"><animate attributeName="cx" values="314;180;180" dur="6s" repeatCount="indefinite"/><animate attributeName="cy" values="42;74;74" dur="6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0.8;0" keyTimes="0;0.38;0.62;1" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="318" cy="144" r="1.8" opacity="0"><animate attributeName="cx" values="318;180;180" dur="6s" repeatCount="indefinite"/><animate attributeName="cy" values="144;74;74" dur="6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.44;0.68;1" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="42" cy="146" r="1.8" opacity="0"><animate attributeName="cx" values="42;180;180" dur="6s" repeatCount="indefinite"/><animate attributeName="cy" values="146;74;74" dur="6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0.8;0" keyTimes="0;0.4;0.64;1" dur="6s" repeatCount="indefinite"/></circle>
  </g>
  <circle class="motion" cx="180" cy="74" r="38" fill="none" stroke="#d7b56e" stroke-width="1.8" stroke-dasharray="3 8" opacity="0.28"><animate attributeName="opacity" values="0.2;0.85;0.85;0.25" keyTimes="0;0.5;0.78;1" dur="6s" repeatCount="indefinite"/></circle>
  <circle cx="180" cy="74" r="6" fill="#8ff5df" opacity="0.45" filter="url(#glow)"/>
  <g text-anchor="middle" font-family="Georgia, serif">
    <text x="180" y="34" fill="#f0d49a" font-size="15" letter-spacing="2.6">TIANJI / AFTER HOURS</text>
    <text x="180" y="119" fill="#f0d49a" font-size="17">BaZi, but schema-validated.</text>
    <text x="180" y="145" fill="#9fb8b7" font-size="12.5">A reproducible reading for an</text>
    <text x="180" y="163" fill="#9fb8b7" font-size="12.5">irreproducible universe.</text>
  </g>
  <path class="motion" d="M30 176 H330" stroke="#62d9d4" stroke-width="1.7" opacity="0" filter="url(#glow)"><animate attributeName="opacity" values="0;0;0.8;0.8;0" keyTimes="0;0.36;0.5;0.72;1" dur="6s" repeatCount="indefinite"/></path>
</svg>
