name: GitHub Profile 3D Contrib

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: Generate the contribution observatory
    steps:
      - uses: actions/checkout@v5
      - uses: yoshi389111/github-profile-3d-contrib@9e3f937195cf840d364388973f73e3c4b3753586
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Move generated SVGs into the profile assets
        run: |
          mkdir -p assets/profile-3d-contrib
          cp profile-3d-contrib/*.svg assets/profile-3d-contrib/
          rm -rf profile-3d-contrib
      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/profile-3d-contrib
          if git diff --cached --quiet; then
            echo "No 3D contribution changes"
          else
            git commit -m "chore: update 3D contribution observatory"
            git push
          fi
