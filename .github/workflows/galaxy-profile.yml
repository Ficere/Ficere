name: Generate galaxy profile assets

on:
  schedule:
    - cron: "30 */12 * * *"
  workflow_dispatch:
  push:
    paths:
      - "config.yml"
      - "generator/**"
      - "requirements-profile.txt"
      - ".github/workflows/galaxy-profile.yml"

concurrency:
  group: profile-generated-assets
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    name: Generate curated galaxy profile SVGs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-profile.txt
      - name: Install generator dependencies
        run: python -m pip install -r requirements-profile.txt
      - name: Generate SVGs from public GitHub data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m generator.main generate
      - name: Commit generated SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/generated
          if git diff --cached --quiet; then
            echo "No galaxy profile changes"
          else
            git commit -m "chore: update galaxy profile assets"
            git pull --rebase origin main
            git push
          fi
