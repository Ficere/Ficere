name: Generate contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main, master]

concurrency:
  group: contribution-snake
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: Ficere
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23b08d57&color_dots=%23ebedf0,%23d8eee9,%23a7d9cf,%2373bdb3,%23549791
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23d7b56e&color_dots=%23070b12,%23142632,%23265a62,%2371c9c2,%23b8fff3

      - name: Publish SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
